site_name: My Learning Notes
site_url: https://github.com/CommanderGoodCheesecake/my-notes/
theme:
  name: material
  palette:
    - primary: deep purple
    - accent: purple
    - scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - search.suggest

nav:
  - Home: index.md
  - UE5:
      - Overview: ue5/index.md
      - Blueprint Basics: ue5/Blueprint Basics.md
  - Blender:
      - Overview: Blender/index.md
      - Getting started with Blender:
          - The starting cube: Blender/Getting started with Blender/The Starting Cube.md
      - Lowpoly Fantasy Weapons:
          - Hammer: Blender/Lowpoly Fantasy Weapons/Hammer.md
          - Shield: Blender/Lowpoly Fantasy Weapons/Shield.md
          - Sword: Blender/Lowpoly Fantasy Weapons/Sword.md
          - Staff: Blender/Lowpoly Fantasy Weapons/Staff.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.keys
  - attr_list

extra_css: 
  - stylesheets/extra.css